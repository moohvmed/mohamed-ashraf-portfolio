<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed Ashraf | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-card: #151518;
            --text-light: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #ffffff;
            --border-color: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Cairo', 'Poppins', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: radial-gradient(circle at center, #1a1a24 0%, var(--bg-dark) 70%);
            position: relative;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInDown 1s ease-out;
        }

        .hero h2 {
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--text-muted);
            margin-bottom: 30px;
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        .scroll-down {
            position: absolute;
            bottom: 40px;
            font-size: 2rem;
            color: var(--text-muted);
            text-decoration: none;
            animation: bounce 2s infinite;
            transition: color 0.3s;
        }
        .scroll-down:hover { color: var(--accent); }

        .portfolio-section {
            padding: 100px 10%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 50px;
            text-align: center;
            font-weight: 800;
            position: relative;
        }
        
        .section-title::after {
            content: '';
            width: 60px;
            height: 3px;
            background: var(--accent);
            display: block;
            margin: 15px auto 0;
            border-radius: 2px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .work-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            color: var(--text-muted);
        }

        .work-card:hover {
            transform: translateY(-10px);
            border-color: #555;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            color: var(--text-light);
        }

        /* تعديل الصور عشان تظهر كاملة بدون قص */
        .work-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
            padding: 10px;
            transition: transform 0.4s ease;
        }

        .work-card:hover img {
            transform: scale(1.03);
        }

        .contact-section {
            padding: 80px 10%;
            background-color: #050505;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .contact-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 30px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            direction: ltr;
        }

        .contact-btn:hover {
            background-color: #ffffff;
            color: #000000;
            transform: translateY(-3px);
        }

        .contact-btn i { font-size: 1.3rem; }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.8rem; }
            .hero h2 { font-size: 1.2rem; }
            .contact-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
